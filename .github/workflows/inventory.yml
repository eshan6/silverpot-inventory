name: Daily inventory sync

on:
  schedule:
    # 05:30 UTC = 01:30 America/New_York (EDT). Actions cron can drift by
    # 10-30 minutes under load; that is fine for a daily inventory pull.
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: inventory-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pull and publish inventory
        env:
          LWA_CLIENT_ID: ${{ secrets.LWA_CLIENT_ID }}
          LWA_CLIENT_SECRET: ${{ secrets.LWA_CLIENT_SECRET }}
          LWA_REFRESH_TOKEN: ${{ secrets.LWA_REFRESH_TOKEN }}
          WALMART_CLIENT_ID: ${{ secrets.WALMART_CLIENT_ID }}
          WALMART_CLIENT_SECRET: ${{ secrets.WALMART_CLIENT_SECRET }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          FORCE_IPV4: ${{ vars.FORCE_IPV4 || 'true' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_TABLE: ${{ vars.SUPABASE_TABLE }}
          SUPABASE_SKU_COLUMN: ${{ vars.SUPABASE_SKU_COLUMN }}
          SUPABASE_QTY_COLUMN: ${{ vars.SUPABASE_QTY_COLUMN }}
        run: python -m collector.main

      - name: Commit feed
        run: |
          git config user.name  "silverpot-inventory-bot"
          git config user.email "actions@github.com"
          git add public/inventory.json
          if git diff --staged --quiet; then
            echo "No inventory change today."
          else
            git commit -m "inventory: $(date -u +%Y-%m-%d)"
            git push
          fi
