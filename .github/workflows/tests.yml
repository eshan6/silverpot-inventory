name: Tests

# The bugs this repo has actually shipped were payload-shape bugs: a stale dict
# key and a wrong guess at an API field name. These tests pin the shapes, need
# no credentials and touch no network, so they run on every push.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python -m unittest discover -s tests -v
