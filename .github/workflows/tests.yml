name: Tests

# The bugs this repo has actually shipped were payload-shape bugs: a stale dict
# key and a wrong guess at an API field name. These tests pin the shapes, need
# no credentials and touch no network, so they run on every push.

# workflow_dispatch is here because on 2026-08-26 a push landed on a branch and
# no run appeared for its SHA. With push and pull_request alone there is no way
# to ask for a run on a commit that CI skipped, short of pushing an empty commit
# to kick it - and this repo publishes stock numbers to a live storefront, so
# merging on "it passed locally" is not the fallback that should be reached for.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python -m unittest discover -s tests -v

  # The authorisation rules are the one part of this repository where being
  # wrong is not a wrong number on a page but someone reading data they should
  # not. They were provable on a laptop and nowhere else, which meant they were
  # only ever proved when someone remembered to.
  policies:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - run: dashboard/supabase/tests/run.sh

  # tsc under strict with noUncheckedIndexedAccess is the only thing standing
  # between a renamed column and a page that renders undefined at a customer's
  # spend figure.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22, not 20: the connector's tests are TypeScript run directly by
          # node --experimental-strip-types, which 20 does not have.
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/web/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Connector logic (OAuth, redirect allow-list, tool arguments)
        run: npm run test:api
