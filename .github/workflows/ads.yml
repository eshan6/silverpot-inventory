name: Ads sync

# Pulls Amazon Advertising figures into the dashboard database.
#
# A third workflow rather than a step inside dashboard.yml, because the two
# have different failure modes and different credentials. Advertising is a
# separate registration from SP-API with its own approval, so it can be denied
# while Orders keeps working perfectly - and a denied Ads call must not stop
# sales from being collected that morning.
#
# 06:37 UTC sits between the sales pull (06:07) and the safety-net slot, on an
# odd minute for the reason CLAUDE.md gives: GitHub delays scheduled workflows
# worst at the times everyone else picks.
#
# The window is 15 days, not 3. Attribution keeps restating recent figures - a
# click today can be credited with a sale for up to 14 days - so yesterday's
# spend-per-unit is not final until the window closes behind it. Rows are
# upserted, so re-reading a day corrects it rather than duplicating it.

on:
  schedule:
    - cron: "37 6 * * *"
    - cron: "07 15 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Days back to re-read, ending yesterday (default 15)"
        type: string
        default: ""
      probe:
        description: "Print Amazon's raw report rows, write nothing"
        type: boolean
        default: false
      dry_run:
        description: "Fetch and normalize, print, write nothing"
        type: boolean
        default: false
      walmart_diagnose:
        description: "Ask Walmart Connect whether our Marketplace credentials reach it. Reads only."
        type: boolean
        default: false
      history_probe:
        description: "Ask the Ads change history endpoint which request shape it accepts. Reads only, writes nothing."
        type: boolean
        default: false
      mcp_probe:
        description: "Ask Amazon's Ads MCP server to list its tools, for a change-history schema. Reads only, writes nothing."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ads-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Walmart advertising is a different product with a different front door,
      # so this is a diagnostic and not a sync: it reads status codes and
      # writes nothing anywhere. It runs instead of the Amazon pull, never
      # alongside it, because it answers a question rather than collecting a
      # number and a failed answer must not look like a failed morning.
      - name: Ask Walmart Connect what our credentials reach
        if: ${{ inputs.walmart_diagnose == true }}
        env:
          WALMART_CLIENT_ID: ${{ secrets.WALMART_CLIENT_ID }}
          WALMART_CLIENT_SECRET: ${{ secrets.WALMART_CLIENT_SECRET }}
          # The advertising gateway does not take the OAuth token. These are
          # the self-serve seller credentials for its signed scheme, and the
          # sweep skips those probes rather than failing when they are absent.
          WALMART_CONSUMER_ID: ${{ secrets.WALMART_CONSUMER_ID }}
          WALMART_PRIVATE_KEY: ${{ secrets.WALMART_PRIVATE_KEY }}
          WALMART_KEY_VERSION: ${{ secrets.WALMART_KEY_VERSION }}
          FORCE_IPV4: ${{ vars.FORCE_IPV4 || 'true' }}
        run: python -m collector.walmart_ads --explore

      # Change history is a different endpoint with a request shape this
      # repository has not yet seen answered. Like the Walmart sweep above
      # this is a diagnostic: it reads, prints what Amazon says, and writes
      # nothing anywhere. It runs instead of the pull so that a failed
      # question never looks like a failed morning.
      - name: Ask the Ads change history endpoint what it accepts
        if: ${{ inputs.history_probe == true }}
        env:
          ADS_CLIENT_ID: ${{ secrets.ADS_CLIENT_ID }}
          ADS_CLIENT_SECRET: ${{ secrets.ADS_CLIENT_SECRET }}
          ADS_REFRESH_TOKEN: ${{ secrets.ADS_REFRESH_TOKEN }}
          ADS_PROFILE_ID: ${{ secrets.ADS_PROFILE_ID }}
          FORCE_IPV4: ${{ vars.FORCE_IPV4 || 'true' }}
        run: python -m collector.ads_history --probe

      # The same question asked of a different surface. POST /history refuses
      # every non-empty eventTypes filter with a message that does not reflect
      # the request, and Amazon's merged OpenAPI specification covers the
      # /adsApi/v1 surface only and does not describe /history at all. An MCP
      # server publishes a schema per tool, so this asks Amazon for the enum
      # instead of guessing a seventh encoding of it. Lists tools; calls none.
      - name: Ask Amazon's Ads MCP server to list its tools
        if: ${{ inputs.mcp_probe == true }}
        env:
          ADS_CLIENT_ID: ${{ secrets.ADS_CLIENT_ID }}
          ADS_CLIENT_SECRET: ${{ secrets.ADS_CLIENT_SECRET }}
          ADS_REFRESH_TOKEN: ${{ secrets.ADS_REFRESH_TOKEN }}
          ADS_PROFILE_ID: ${{ secrets.ADS_PROFILE_ID }}
          FORCE_IPV4: ${{ vars.FORCE_IPV4 || 'true' }}
        run: python -m collector.ads_mcp --probe

      - name: Pull advertising into the dashboard
        if: ${{ inputs.walmart_diagnose != true && inputs.history_probe != true && inputs.mcp_probe != true }}
        env:
          # Advertising credentials are their own set. They are not the SP-API
          # ones under a different name: different registration, different
          # authorisation server audience, and a profile id that has no SP-API
          # equivalent.
          ADS_CLIENT_ID: ${{ secrets.ADS_CLIENT_ID }}
          ADS_CLIENT_SECRET: ${{ secrets.ADS_CLIENT_SECRET }}
          ADS_REFRESH_TOKEN: ${{ secrets.ADS_REFRESH_TOKEN }}
          ADS_PROFILE_ID: ${{ secrets.ADS_PROFILE_ID }}
          FORCE_IPV4: ${{ vars.FORCE_IPV4 || 'true' }}
          DASHBOARD_SUPABASE_URL: ${{ secrets.DASHBOARD_SUPABASE_URL }}
          DASHBOARD_SUPABASE_SERVICE_KEY: ${{ secrets.DASHBOARD_SUPABASE_SERVICE_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.days }}" ]; then
            ARGS="$ARGS --days ${{ inputs.days }}"
          fi
          if [ "${{ inputs.probe }}" = "true" ]; then
            ARGS="$ARGS --probe"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python -m collector.ads_sync $ARGS
